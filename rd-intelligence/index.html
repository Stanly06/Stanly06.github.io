<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RD Intelligence Platform</title>
<meta name="description" content="RD Economic & Financial Intelligence Platform: Dominican exchange rate, inflation, cost of living, fuel, consumer, electricity and agricultural prices from official sources, built on a Databricks lakehouse. Portfolio project by Stanly Fernández.">
<meta property="og:title" content="RD Economic & Financial Intelligence Platform">
<meta property="og:description" content="Official Dominican economic and price data · Databricks Medallion lakehouse · Power BI · by Stanly Fernández">
<meta property="og:image" content="https://stanly06.github.io/og-image.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 20'%3E%3Crect width='30' height='20' fill='%23fff'/%3E%3Crect width='13' height='8' fill='%23002D62'/%3E%3Crect x='17' width='13' height='8' fill='%23CE1126'/%3E%3Crect y='12' width='13' height='8' fill='%23CE1126'/%3E%3Crect x='17' y='12' width='13' height='8' fill='%23002D62'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preload" href="data/core.json" as="fetch" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap"></noscript>
<style>
/* Layout: fixed sidebar (collapsible) + scrolling main column; pages are views rendered from a registry.
   Themes: "dom" = Dominicana Institucional (light), "fi" = Financial Intelligence (dark). Default follows the viewer. */
:root{
  --primary:#0B3C7D; --accent:#CE1126; --accent2:#1A8A7A; --gold:#E8A33D;
  --bg:#F4F7FB; --side:#FFFFFF; --card:#FFFFFF; --raised:#EEF3F9;
  --text:#152238; --muted:#526277; --border:#DEE5EF; --grid:#E6ECF4;
  --good:#1F7A4D; --warn:#9A6200; --bad:#B42318;
  --s1:#0B3C7D; --s2:#1A8A7A; --s3:#CE1126; --s4:#E8A33D; --s5:#6B4FA0; --s6:#3E8ED0;
  --font-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --font-body:"Public Sans","Segoe UI",system-ui,sans-serif;
  --radius:12px; --shadow:0 1px 2px rgba(21,34,56,.06),0 4px 14px rgba(21,34,56,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]):not([data-app-theme="dom"]){
  --primary:#38BDF8; --accent:#F5C76B; --accent2:#5EEAD4; --gold:#F5C76B;
  --bg:#080F1E; --side:#0D1729; --card:#121F35; --raised:#192A43;
  --text:#F1F5F9; --muted:#A6B4C8; --border:#293A53; --grid:#1E2E47;
  --good:#4ADE80; --warn:#FBBF24; --bad:#F87171;
  --s1:#38BDF8; --s2:#F5C76B; --s3:#F87171; --s4:#5EEAD4; --s5:#C4B5FD; --s6:#86EFAC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark } }
:root[data-theme="dark"]:not([data-app-theme="dom"]), :root[data-app-theme="fi"]{
  --primary:#38BDF8; --accent:#F5C76B; --accent2:#5EEAD4; --gold:#F5C76B;
  --bg:#080F1E; --side:#0D1729; --card:#121F35; --raised:#192A43;
  --text:#F1F5F9; --muted:#A6B4C8; --border:#293A53; --grid:#1E2E47;
  --good:#4ADE80; --warn:#FBBF24; --bad:#F87171;
  --s1:#38BDF8; --s2:#F5C76B; --s3:#F87171; --s4:#5EEAD4; --s5:#C4B5FD; --s6:#86EFAC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }
:root[data-app-theme="dom"]{ color-scheme:light }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:14px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100%}
.app.collapsed{grid-template-columns:76px minmax(0,1fr)}

/* Sidebar */
.side{background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:6px;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 14px}
.brand svg.flag{width:42px;height:28px;flex:none;border-radius:4px;box-shadow:0 0 0 1px var(--border)}
.brand b{font-family:var(--font-display);font-size:17px;line-height:1.1;display:block;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:11.5px}
.collapsed .brand-text,.collapsed .nav-label,.collapsed .side-foot-text{display:none}
.nav{display:flex;flex-direction:column;gap:2px;list-style:none;margin:0;padding:0}
.nav button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;border-radius:10px;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--raised);color:var(--text)}
.nav button[aria-current="page"]{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--text);box-shadow:inset 3px 0 0 var(--primary)}
.nav svg{width:20px;height:20px;flex:none}
.nav .sep{height:1px;background:var(--border);margin:8px 10px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:10px 8px 0;border-top:1px solid var(--border);color:var(--muted);font-size:12px}
.side-foot .row{display:flex;gap:8px;align-items:center}
.side-foot svg{width:18px;height:18px;flex:none}
.collapse-btn{border:1px solid var(--border);background:var(--card);border-radius:8px;padding:6px 8px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--muted)}

/* Main */
.main{min-width:0;display:flex;flex-direction:column}
.tricolor{height:4px;background:linear-gradient(90deg,#002D62 0 33.3%,#FFFFFF 33.3% 66.6%,#CE1126 66.6%);box-shadow:inset 0 -1px 0 var(--border)}
.topbar{padding-block:20px 8px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between}
.crumb{color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center}
.crumb svg{width:16px;height:11px;border-radius:2px}
h1{font-family:var(--font-display);font-size:clamp(24px,3vw,34px);line-height:1.1;margin:4px 0 4px;letter-spacing:-.02em;text-wrap:balance}
.lead{color:var(--muted);margin:0;max-width:70ch}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid}
.badge.sim{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.badge.real{color:var(--good);border-color:color-mix(in srgb,var(--good) 55%,transparent);background:color-mix(in srgb,var(--good) 10%,transparent)}
.badge.demo{color:var(--muted);border-color:var(--border)}
.theme-box{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px}
.theme-box label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.theme-box select{background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:5px 8px}
.theme-box input[type=color]{width:30px;height:26px;border:1px solid var(--border);border-radius:6px;padding:0;background:none;cursor:pointer}
.btn{border:1px solid var(--border);background:var(--raised);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--primary)}
.content{padding-block:8px 32px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.filters select{background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:7px 10px;min-width:150px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--text);font-size:13.5px}
.filters .spacer{flex:1}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 16px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k-head{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:600}
.kpi .k-head svg{width:18px;height:18px;color:var(--primary);flex:none}
.kpi .k-val{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .k-sub{color:var(--muted);font-size:12.5px}
.kpi .k-delta{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .k-tag{align-self:flex-start;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .k-tag.sim{color:var(--warn)}
.kpi svg.spark{width:100%;height:34px;margin-top:4px}
.up::before{content:"▲ "}.down::before{content:"▼ "}.flat::before{content:"■ "}

/* Panels */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media (max-width:1100px){.grid3{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;min-width:0;display:flex;flex-direction:column;gap:8px}
.panel h2{font-family:var(--font-display);font-size:17px;margin:0;letter-spacing:-.01em}
.panel .p-sub{color:var(--muted);font-size:12.5px;margin:0}
.panel .p-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.chart{position:relative;height:280px}
.chart.tall{height:340px}
.chart.short{height:220px}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--accent2);padding:6px 10px;background:var(--raised);border-radius:0 8px 8px 0}
.obs{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.obs li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.obs li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent2);margin-top:7px;flex:none}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:10px}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{background:var(--raised);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);position:sticky;top:0}
tbody tr:hover{background:var(--raised)}
.tbl-scroll{max-height:320px;overflow:auto}
.status{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}
.status.real{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.status.sim{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.status.pend{color:var(--muted);background:var(--raised)}
.medallion{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.layer{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--raised)}
.layer b{font-family:var(--font-display)}
.footer{color:var(--muted);font-size:12px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-top:1px solid var(--border);padding-top:12px}
.footer span{display:inline-flex;gap:6px;align-items:center}
.footer svg{width:16px;height:16px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:max(20px,env(safe-area-inset-right,0px));background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.menu-btn{display:none}
.fade{animation:fade .25s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.toast{transition:none}}

@media (max-width:820px){
  .app,.app.collapsed{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(280px,85vw);z-index:20;transform:translateX(-105%);transition:transform .2s;height:100%;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .app.menu-open .side{transform:none}
  .collapsed .brand-text,.collapsed .nav-label,.collapsed .side-foot-text{display:revert}
  .collapse-btn{display:none}
  .menu-btn{display:inline-flex}
  .topbar,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .filters select{min-width:0;width:100%}
  .filters label{flex:1 1 140px}
  .kpi .k-val{font-size:24px}
}

/* v8 additions: language switch, source chips, header links */
.top-tools{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.lang-sw{display:inline-flex;padding:3px;border-radius:10px;border:1px solid var(--border);background:var(--card);gap:2px}
.lang-sw button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:12px;padding:5px 10px;border-radius:7px;cursor:pointer;letter-spacing:.04em}
.lang-sw button[aria-pressed="true"]{background:var(--primary);color:#fff}
.top-links{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.top-links a{text-decoration:none}
.src-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 10px 3px 6px;background:var(--card);text-decoration:none}
.src-chip svg{width:16px;height:16px;color:var(--primary)}
.src-chip:hover{border-color:var(--primary);color:var(--text)}
.badge a{color:inherit}
.panel .btn.link,.btn.link{align-self:flex-start}
.btn svg{width:15px;height:15px;flex:none}
@media (max-width:820px){.top-tools{align-items:flex-start;width:100%}.top-links{justify-content:flex-start}}
html,body{margin:0}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand">
      <svg class="flag" viewBox="0 0 30 20" role="img" id="flagImg"><use href="#flag"/></svg>
      <div class="brand-text"><b>RD Intelligence Platform</b><small>Economic &amp; Financial Intelligence</small></div>
    </div>
    <ul class="nav" id="nav"></ul>
    <div class="side-foot">
      <button class="collapse-btn" id="collapseBtn" type="button" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg><span class="side-foot-text" data-t="collapse"></span></button>
      <div class="row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span class="side-foot-text" data-t="byline"></span></div>
    </div>
  </aside>

  <div class="main">
    <div class="tricolor" aria-hidden="true"></div>
    <header class="topbar">
      <div style="min-width:0">
        <div class="crumb"><button class="btn menu-btn" id="menuBtn" type="button">☰</button><svg viewBox="0 0 30 20" aria-hidden="true"><use href="#flag"/></svg><span data-t="platform"></span><span>/</span><span id="crumbPage"></span></div>
        <h1 id="pageTitle"></h1>
        <p class="lead" id="pageLead"></p>
        <div class="badges" id="pageBadges"></div>
      </div>
      <div class="top-tools">
        <div class="lang-sw" role="group" aria-label="Idioma / Language">
          <button type="button" data-lang="es" title="Español">ES</button>
          <button type="button" data-lang="en" title="English">EN</button>

          <label for="themeSel"><span data-t="theme"></span>
            <select id="themeSel">
              <option value="auto" data-t="themeAuto"></option>
              <option value="dom" data-t="themeDom"></option>
              <option value="fi">Financial Intelligence</option>

          </label>
        </div>
        <div class="top-links">
          <a class="btn" href="https://github.com/Stanly06/rd-economic-financial-intelligence" target="_blank" rel="noreferrer"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.6 22.4c.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A11.5 11.5 0 0 0 12 .5z"/></svg><span data-t="repo"></span></a>
          <a class="btn" id="portfolioLink" href="https://stanly06.github.io/#rd-platform"><span data-t="portfolio"></span></a>
        </div>
      </div>
    </header>
    <main class="content" id="content" tabindex="-1"><div class="empty" id="bootMsg">Cargando datos… · Loading data…</div></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="flag" viewBox="0 0 30 20">
      <rect width="30" height="20" fill="#FFFFFF"/>
      <rect x="0" y="0" width="13" height="8" fill="#002D62"/>
      <rect x="17" y="0" width="13" height="8" fill="#CE1126"/>
      <rect x="0" y="12" width="13" height="8" fill="#CE1126"/>
      <rect x="17" y="12" width="13" height="8" fill="#002D62"/>

      <path d="M13.2 9.2c-.3 1.4.4 2.6 1.8 3M16.8 9.2c.3 1.4-.4 2.6-1.8 3" fill="none" stroke="#2E7D32" stroke-width=".35"/>
    </symbol>
  </defs>
</svg>

<script>
/* data starts downloading before anything else runs */
const CORE_P = fetch("data/core.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
let AGRI_P = null; const loadAgri = () => AGRI_P || (AGRI_P = fetch("data/agri.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }));
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<script>
let REAL = null;
/* RD Intelligence Platform · web version (ES / EN). Every figure comes from the project's Gold/Silver tables (see REAL.generated). */

/* ===================== LANGUAGE ===================== */
const qsLang = new URLSearchParams(location.search).get("lang");
let LANG = (() => { if (qsLang === "en" || qsLang === "es") return qsLang;
  try { return localStorage.getItem("rdip.lang") || localStorage.getItem("sf-lang") || ((navigator.language||"").toLowerCase().startsWith("es") ? "es" : "en"); } catch(e){ return "es"; } })();
const tr = (es, en) => LANG === "en" ? en : es;
const STATIC = {
  collapse:["Plegar menú","Collapse menu"], byline:["Proyecto de portafolio · Stanly Fernández","Portfolio project · Stanly Fernández"],
  platform:["Plataforma","Platform"], theme:["Tema","Theme"], themeAuto:["Automático","Automatic"], themeDom:["Dominicana Institucional","Dominican Institutional"],
  repo:["Repositorio","Repository"], portfolio:["Portafolio","Portfolio"]
};
const NAMES = { // data labels published in Spanish by the sources

function spark(values, colorVar="--primary"){
  const v = values.filter(x => x != null); if (v.length < 2) return "";
  const min = Math.min(...v), max = Math.max(...v), w = 200, h = 34, step = w/(v.length-1);
  const pts = v.map((x,i) => `${(i*step).toFixed(1)},${(h-3-(max===min?.5:(x-min)/(max-min))*(h-6)).toFixed(1)}`).join(" ");
  const last = pts.split(" ").pop().split(",");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="var(${colorVar})" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(${colorVar})"/></svg>`;
}

}

}

    ${kpi({icon:"fx",label:tr("Rango 52 semanas (venta)","52-week range (sell)"),value:`${nf(Math.min(...win),2)} – ${nf(Math.max(...win),2)}`,sub:tr("Mínimo – máximo","Low – high"),tag:"BCRD"})}
  </section>

    <div class="panel"><div class="p-head"><div><h2>${tr("Promedio anual de la tasa de venta","Annual average sell rate")}</h2><p class="p-sub">${tr("DOP por USD · 1991 a la fecha (año en curso parcial)","DOP per USD · 1991 to date (current year partial)")}</p></div>${real()}</div><div class="chart tall"><canvas id="f2"></canvas></div></div>
  </section>
  <section class="panel"><div class="p-head"><div><h2>${tr("Resumen mensual de la tasa de venta","Monthly summary of the sell rate")}</h2><p class="p-sub">${tr("Cierre = último día hábil del mes · variaciones convencionales (↑ = depreciación del peso)","Close = last business day of the month · conventional changes (↑ = peso depreciation)")}</p></div>${csvBtn("cpyFx")}</div><div id="fxTbl"></div></section>
  <p class="note">${tr("Historia desde 1991: archivo diario oficial del BCRD (descarga automática). Un dato de la fuente (25 ene 1991, compra mayor que venta) fue rechazado por las reglas de calidad.","History since 1991: official BCRD daily file (automatic download). One source record (Jan 25, 1991, buy above sell) was rejected by the data-quality rules.")}</p>`);
  const ds = [];
  if (period){
    const ma = idx.map(i => i>=29 ? fx.s.slice(i-29,i+1).reduce((a,b)=>a+b,0)/30 : null);

  $("#fxTbl").innerHTML = table(cols, rows); bindCopy("cpyFx", cols, rows, tr("tipo de cambio","exchange rate")); bindFilters(D);

  // detail table
  const rows = priced.map(s => { const fam = AG.byKey[s[2]+"|"+s[3]] || {};
      const mk = ch===0 ? AG.retailMarkets.filter(([n,i]) => fam[i] && fam[i][5][mi]!=null).map(([n,i]) => ({n, p:fam[i][5][mi]})) : [];
      const lo = mk.length ? mk.reduce((a,b)=>b.p<a.p?b:a) : null, hi = mk.length ? mk.reduce((a,b)=>b.p>a.p?b:a) : null;
      return {s, row:[A.products[s[2]], nm(A.rubros[s[4]]), A.units[s[3]], nf(s[5][mi]), pct(mom(s)), pct(yoy(s)), mi===last && s[7]!=null ? nf(s[7],1) : "—",
        lo?`${lo.n} (${nf(lo.p)})`:"—", hi?`${hi.n} (${nf(hi.p)})`:"—", mk.length>=2?pct((hi.p/lo.p-1)*100,0):"—"]}; })
    .sort((a,b)=>a.row[0].localeCompare(b.row[0],"es")).map(x=>x.row);
  const cols = [tr("Producto","Product"),tr("Grupo","Group"),tr("Unidad","Unit"),tr("Precio RD$","Price RD$"),tr("Var. mensual","Monthly"),tr("Var. interanual","YoY"),tr("Volatilidad 12m","12m volatility"),tr("Más barato en","Cheapest in"),tr("Más caro en","Most expensive in"),tr("Dif. máx/mín","Max/min gap")];
  $("#agTbl").innerHTML = table(cols, rows); bindCopy("cpyAg", cols, rows, tr("precios agropecuarios","agricultural prices")); bindFilters(D);
  $("#toRegion").addEventListener("click", () => { state.f.inf_dim = "region"; navigate("inflacion", true); });
}

    [tr("Precios de productos (CON-001…005)","Basic-goods prices (CON-001…005)"),"Pro Consumidor · datos.gob.do",tr("Mensual (reporte trimestral)","Monthly (quarterly report)"),tr("jul – sep 2026","Jul – Sep 2026"),ok],

    ${table([tr("Indicador","Indicator"),tr("Fuente","Source"),tr("Frecuencia","Frequency"),tr("Cobertura","Coverage"),tr("Carga","Load")], rows)}
    <div class="badges">${["bcrd","micm","pc","mem","ma","portal"].map(srcChip).join("")}</div></section>
  <section class="panel"><h2>${tr("Arquitectura Medallion en Databricks","Medallion architecture on Databricks")}</h2>
    <div class="medallion">
      <div class="layer"><b>${tr("Descarga","Acquisition")}</b><p class="p-sub">${tr("Cada fuente se descarga automáticamente (API de datos.gob.do, sitios del BCRD y del MEM) a un archivo histórico que nunca se sobrescribe.","Each source is downloaded automatically (datos.gob.do API, BCRD and MEM sites) into an append-only archive that is never overwritten.")}</p></div>
      <div class="layer"><b>Bronze</b><p class="p-sub">${tr("Auto Loader registra cada archivo nuevo una sola vez y lo guarda tal como se publicó, con trazabilidad (archivo, fila, lote, hash).","Auto Loader registers each new file once and stores it as published, with lineage (file, row, batch, hash).")}</p></div>
      <div class="layer"><b>Silver</b><p class="p-sub">${tr("Datos tipados y validados. Reglas de calidad obligatorias; lo que falla se guarda aparte. Conciliación: Bronze = Silver + rechazados.","Typed and validated data. Enforced quality rules; failing records are kept apart. Reconciliation: Bronze = Silver + rejected.")}</p></div>

/* ===================== THEME & LANGUAGE ===================== */
function loadPrefs(){ try{ return JSON.parse(localStorage.getItem("rdip.theme")||"{}"); }catch(e){ return {}; } }
function savePrefs(p){ try{ localStorage.setItem("rdip.theme", JSON.stringify(p)); }catch(e){} }
function applyTheme(redraw=true){
  const p = loadPrefs(), root = document.documentElement;
  if (p.theme && p.theme!=="auto") root.setAttribute("data-app-theme", p.theme); else root.removeAttribute("data-app-theme");
  $("#themeSel").value = p.theme || "auto";
  if (redraw) draw();
}
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(e => { const v = STATIC[e.dataset.t]; if (v) e.textContent = tr(v[0], v[1]); });
  document.querySelectorAll(".lang-sw button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang===LANG)));
  $("#side").setAttribute("aria-label", tr("Navegación principal","Main navigation"));
  $("#flagImg").setAttribute("aria-label", tr("Bandera de República Dominicana","Flag of the Dominican Republic"));
  $("#menuBtn").setAttribute("aria-label", tr("Abrir menú","Open menu"));
  $("#themeBox").setAttribute("aria-label", tr("Apariencia","Appearance"));
  $("#portfolioLink").href = `https://stanly06.github.io/?lang=${LANG}#rd-platform`;
  $("#nav").innerHTML = PAGES.map(p => `${p.sep?'<li class="sep" role="separator"></li>':""}<li><button type="button" data-id="${p.id}" title="${L(p)}">${icon(p.icon)}<span class="nav-label">${L(p)}</span></button></li>`).join("");
}
document.querySelectorAll(".lang-sw button").forEach(b => b.addEventListener("click", () => {
  LANG = b.dataset.lang; try{ localStorage.setItem("rdip.lang", LANG); localStorage.setItem("sf-lang", LANG); }catch(e){}
  const u = new URL(location.href); u.searchParams.set("lang", LANG); history.replaceState(null, "", u.pathname + u.search + u.hash);
  applyLang(); navigate(state.page);
}));
$("#themeSel").addEventListener("change", e => { const p = loadPrefs(); p.theme = e.target.value; savePrefs(p); applyTheme(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme());

/* ===================== BOOT ===================== */
$("#nav").addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) navigate(b.dataset.id, true); });
$("#collapseBtn").addEventListener("click", () => { const c = $("#app").classList.toggle("collapsed"); $("#collapseBtn").setAttribute("aria-expanded", String(!c)); setTimeout(()=>charts.forEach(ch=>ch.resize()),50); });
$("#menuBtn").addEventListener("click", () => $("#app").classList.toggle("menu-open"));
document.addEventListener("keydown", e => { if (e.key==="Escape") $("#app").classList.remove("menu-open"); });
let start = location.hash.slice(1); if (!PAGES.some(p=>p.id===start)) { try{ start = localStorage.getItem("rdip.page") || "panorama"; }catch(e){ start = "panorama"; } }
state.page = PAGES.some(p=>p.id===start) ? start : "panorama";
applyLang(); applyTheme(false);
$("#bootMsg").textContent = tr("Cargando datos…","Loading data…");
if (state.page === "agro") loadAgri();
const chartReady = new Promise(res => window.Chart ? res() : window.addEventListener("DOMContentLoaded", res));
Promise.all([CORE_P, chartReady]).then(([core]) => { REAL = core; navigate(state.page); })
  .catch(() => { $("#content").innerHTML = `<div class="empty">${tr("No se pudieron cargar los datos. Recarga la página.","Data could not be loaded. Please reload the page.")}</div>`; });

</script>
